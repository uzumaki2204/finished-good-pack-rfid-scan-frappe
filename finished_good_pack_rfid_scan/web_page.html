<main id="rfid-app" class="container-fluid py-3">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-11 col-md-10 col-lg-8 col-xl-7">
      <header class="d-flex align-items-center justify-content-between mb-3">
        <div class="d-flex align-items-center">
          <img src="/assets/finished_good_pack_rfid_scan/rfid/logo.png" class="bg-white rounded mr-2" width="44" height="44" alt="">
          <h1 class="h5 mb-0" data-i18n="ui.title"></h1>
        </div>
        <div class="d-flex align-items-center">
          <span id="network-status" class="text-success mr-2" role="status" aria-live="polite" data-i18n-aria="ui.online">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0"></path><path d="M5 12a10 10 0 0 1 14 0"></path><path d="M8.5 15.5a5 5 0 0 1 7 0"></path><path d="M12 19h.01"></path></svg>
            <span id="network-status-label" class="sr-only"></span>
          </span>
          <button id="device-settings" type="button" class="btn btn-default btn-sm" data-i18n-aria="ui.device_settings" data-i18n-title="ui.device_settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2"></rect><path d="M10 5.5h4M11 18.5h2"></path></svg>
          </button>
        </div>
      </header>
      <div id="notice" class="alert" role="status" aria-live="polite" hidden></div>

      <section id="device-view">
        <div class="frappe-card p-3 mb-3">
          <div class="d-flex justify-content-between align-items-center">
            <span id="device-status-badge" class="indicator-pill orange" data-i18n="ui.device_not_activated"></span>
            <button id="return-to-app" type="button" class="btn btn-default btn-sm" data-i18n="ui.back_to_app" hidden></button>
          </div>
          <h2 class="h5 mt-2 mb-0" data-i18n="ui.shared_device_qr"></h2>
        </div>

        <div class="frappe-card p-3 mb-3">
          <div class="d-flex flex-wrap justify-content-between align-items-center mb-2">
            <h2 class="h6 mb-2" data-i18n="ui.qr_device"></h2>
            <button id="scan-qr" type="button" class="btn btn-default mb-2" data-i18n="ui.camera_enable"></button>
          </div>
          <div class="embed-responsive embed-responsive-16by9 bg-dark rounded">
            <video id="qr-video" class="embed-responsive-item bg-dark" width="640" height="360" playsinline muted data-i18n-aria="ui.camera_view"></video>
          </div>
          <p id="camera-status" class="text-muted mt-2 mb-3" data-i18n="ui.camera_idle" role="status" aria-live="polite"></p>

          <div class="d-flex align-items-center my-3">
            <hr class="flex-grow-1 my-0"><span class="text-muted px-2" data-i18n="ui.or"></span><hr class="flex-grow-1 my-0">
          </div>
          <div class="form-group mb-3">
            <label for="device-id" data-i18n="ui.device_id_manual"></label>
            <input id="device-id" class="form-control" autocomplete="off" spellcheck="false" data-i18n-placeholder="ui.device_id_placeholder">
          </div>
          <div class="d-flex">
            <button id="activate-device" type="button" class="btn btn-primary flex-grow-1 mr-2 mb-2" data-i18n="ui.activate_sync"></button>
            <button id="check-device" type="button" class="btn btn-default mb-2" data-i18n="ui.check_device"></button>
          </div>
        </div>

        <div class="row">
          <div class="col-6 mb-3">
            <div class="frappe-card p-3 h-100"><small class="text-muted d-block" data-i18n="ui.device_name"></small><strong id="device-name-label" class="text-break"></strong></div>
          </div>
          <div class="col-6 mb-3">
            <div class="frappe-card p-3 h-100"><small class="text-muted d-block" data-i18n="ui.company"></small><strong id="device-company-label" class="text-break"></strong></div>
          </div>
        </div>
      </section>

      <section id="home-view" hidden>
        <div class="frappe-card p-3 mb-3">
          <div class="d-flex justify-content-between align-items-center">
            <h2 class="h5 mb-0" data-i18n="ui.device"></h2>
            <button id="change-device" class="btn btn-default btn-sm" type="button" data-i18n="ui.clear_device"></button>
          </div>
          <p id="device-summary" class="text-muted text-break"></p>
          <div class="form-group"><label for="booking-ids" data-i18n="ui.booking_ids"></label><textarea id="booking-ids" class="form-control" rows="3" aria-describedby="booking-hint"></textarea><small id="booking-hint" class="text-muted" data-i18n="ui.booking_hint"></small></div>
          <button id="start-session" type="button" class="btn btn-primary btn-block" data-i18n="ui.start"></button>
        </div>
        <div class="row">
          <section class="col-12 mb-3"><div class="frappe-card p-3"><div class="d-flex justify-content-between align-items-center"><h2 class="h5" data-i18n="ui.active"></h2><button id="refresh-active" type="button" class="btn btn-default btn-sm" data-i18n="ui.refresh"></button></div><div id="active-list"></div></div></section>
          <section class="col-12 mb-3"><div class="frappe-card p-3"><div class="d-flex justify-content-between align-items-center"><h2 class="h5" data-i18n="ui.history"></h2><button id="refresh-history" type="button" class="btn btn-default btn-sm" data-i18n="ui.refresh"></button></div><div id="history-list"></div></div></section>
        </div>
      </section>

      <section id="session-view" hidden>
        <div class="frappe-card p-3 mb-3">
          <div class="d-flex flex-wrap justify-content-between align-items-center">
            <h2 id="session-title" class="h5"></h2>
            <button id="back-home" type="button" class="btn btn-default btn-sm" data-i18n="ui.home"></button>
          </div>
          <p id="session-summary" class="text-muted"></p>
          <div id="session-warnings" class="alert alert-warning" hidden></div>
          <div id="completed-details" class="row" hidden>
            <div class="col-12 col-sm-6 mb-2"><small class="text-muted d-block" data-i18n="ui.vehicle"></small><strong id="completed-vehicle" class="text-break"></strong></div>
            <div class="col-12 col-sm-6 mb-2"><small class="text-muted d-block" data-i18n="ui.driver"></small><strong id="completed-driver" class="text-break"></strong></div>
            <div class="col-12 mb-2"><small class="text-muted d-block" data-i18n="ui.note"></small><span id="completed-note" class="text-break"></span></div>
          </div>
        </div>

        <section id="completion-form" class="frappe-card p-3 mb-3" aria-labelledby="completion-title" hidden>
          <h3 id="completion-title" class="h6" data-i18n="ui.complete_details"></h3>
          <div class="form-group"><label for="completion-vehicle" data-i18n="ui.vehicle"></label><input id="completion-vehicle" class="form-control" autocomplete="off" required></div>
          <div class="form-group"><label for="completion-driver" data-i18n="ui.driver"></label><input id="completion-driver" class="form-control" autocomplete="off" required></div>
          <div class="form-group"><label for="completion-note" data-i18n="ui.note"></label><textarea id="completion-note" class="form-control" rows="3"></textarea></div>
          <div class="d-flex">
            <button id="cancel-completion" type="button" class="btn btn-default flex-grow-1 mr-2" data-i18n="ui.cancel"></button>
            <button id="confirm-completion" type="button" class="btn btn-primary flex-grow-1" data-i18n="ui.confirm_completion"></button>
          </div>
        </section>

        <div class="nav nav-tabs nav-fill mb-3" role="tablist" data-i18n-aria="ui.session_tabs">
          <button id="tab-po" type="button" class="nav-link active small px-1" role="tab" data-session-tab="po" aria-controls="panel-po" aria-selected="true" tabindex="0"><span data-i18n="ui.po"></span> <span id="tab-po-count" class="badge badge-light">0</span></button>
          <button id="tab-items" type="button" class="nav-link small px-1" role="tab" data-session-tab="items" aria-controls="panel-items" aria-selected="false" tabindex="-1"><span data-i18n="ui.items"></span> <span id="tab-items-count" class="badge badge-light">0</span></button>
          <button id="tab-boxes" type="button" class="nav-link small px-1" role="tab" data-session-tab="boxes" aria-controls="panel-boxes" aria-selected="false" tabindex="-1"><span data-i18n="ui.boxes"></span></button>
          <button id="tab-sync" type="button" class="nav-link small px-1" role="tab" data-session-tab="sync" aria-controls="panel-sync" aria-selected="false" tabindex="-1"><span data-i18n="ui.tab_sync"></span> <span id="tab-sync-count" class="badge badge-light">0</span></button>
        </div>
        <section id="panel-po" class="frappe-card p-3 mb-3" role="tabpanel" aria-labelledby="tab-po"><div id="po-list" class="table-responsive"></div></section>
        <section id="panel-items" class="frappe-card p-3 mb-3" role="tabpanel" aria-labelledby="tab-items" hidden><div id="item-list" class="table-responsive"></div></section>
        <section id="panel-boxes" class="frappe-card p-3 mb-3" role="tabpanel" aria-labelledby="tab-boxes" hidden>
          <div class="btn-group btn-group-sm d-flex mb-3" role="group" data-i18n-aria="ui.box_filters">
            <button type="button" class="btn btn-primary flex-fill" data-box-filter="not-scanned" aria-pressed="true"><span data-i18n="ui.box_not_scanned"></span> <span id="box-not-scanned-count" class="badge badge-light">0</span></button>
            <button type="button" class="btn btn-default flex-fill" data-box-filter="scanning" aria-pressed="false"><span data-i18n="ui.box_scanning"></span> <span id="box-scanning-count" class="badge badge-light">0</span></button>
            <button type="button" class="btn btn-default flex-fill" data-box-filter="completed" aria-pressed="false"><span data-i18n="ui.box_completed"></span> <span id="box-completed-count" class="badge badge-light">0</span></button>
          </div>
          <div class="d-flex mb-3"><label for="box-search" class="sr-only" data-i18n="ui.box_search"></label><input id="box-search" type="search" class="form-control mr-2" data-i18n-placeholder="ui.box_search"><button id="clear-box-search" type="button" class="btn btn-default" data-i18n-aria="ui.clear_filter" data-i18n-title="ui.clear_filter"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg></button></div>
          <div id="box-list" class="table-responsive"></div>
        </section>
        <section id="panel-sync" class="frappe-card p-3 mb-3" role="tabpanel" aria-labelledby="tab-sync" hidden>
          <p id="sync-status" class="text-muted" role="status" aria-live="polite"></p>
          <div id="scan-list" class="table-responsive"></div>
          <div id="sync-actions" class="mt-3" hidden>
            <div class="form-group"><label for="booking-select" data-i18n="ui.booking_ids"></label><select id="booking-select" class="form-control"></select></div>
            <div class="d-flex flex-wrap">
              <button id="refresh-booking" type="button" class="btn btn-default mr-2 mb-2" data-i18n="ui.refresh_booking"></button>
              <button id="rehydrate-plan" type="button" class="btn btn-default mr-2 mb-2" data-i18n="ui.rehydrate"></button>
              <button id="delete-session" type="button" class="btn btn-danger mb-2" data-i18n="ui.delete"></button>
            </div>
          </div>
        </section>
        <div id="scan-dock-spacer" class="py-5 mb-5" aria-hidden="true" hidden></div>
        <div id="scan-dock" class="fixed-bottom bg-white border-top shadow-sm py-2" hidden>
          <div class="container-fluid"><div class="row justify-content-center"><div class="col-12 col-sm-11 col-md-10 col-lg-8 col-xl-7">
            <div id="scan-controls" class="d-flex align-items-center mb-2"><label for="rfid-input" class="sr-only" data-i18n="ui.scan_rfid"></label><input id="rfid-input" class="form-control" autocomplete="off" spellcheck="false" data-i18n-placeholder="ui.scan_rfid"><button id="add-scan" type="button" class="btn btn-primary ml-2" data-i18n="ui.add_scan"></button></div>
            <button id="complete-session" type="button" class="btn btn-primary btn-block" data-i18n="ui.complete"></button>
          </div></div></div>
        </div>
      </section>
    </div>
  </div>
</main>
