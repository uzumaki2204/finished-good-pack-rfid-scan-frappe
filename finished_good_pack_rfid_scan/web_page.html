<main id="rfid-app" class="container-fluid py-3">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-11 col-md-10 col-lg-8 col-xl-7">
      <header class="d-flex align-items-center justify-content-between mb-3">
        <div class="d-flex align-items-center">
          <img src="/assets/finished_good_pack_rfid_scan/rfid/logo.png" class="bg-white rounded mr-2" width="44" height="44" alt="">
          <div class="rfid-heading"><h1 id="screen-title" class="h5 mb-0" data-i18n="ui.title"></h1><small id="session-booking" class="text-muted" hidden></small></div>
        </div>
        <div class="d-flex align-items-center">
          <span id="network-status" class="text-success mr-2" role="status" aria-live="polite" data-i18n-aria="ui.online">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0"></path><path d="M5 12a10 10 0 0 1 14 0"></path><path d="M8.5 15.5a5 5 0 0 1 7 0"></path><path d="M12 19h.01"></path></svg>
            <span id="network-status-label" class="sr-only"></span>
          </span>
          <button id="device-settings" type="button" class="btn btn-default p-3" data-i18n-aria="ui.device_settings" data-i18n-title="ui.device_settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2"></rect><path d="M10 5.5h4M11 18.5h2"></path></svg>
          </button>
          <button id="theme-toggle" type="button" class="btn btn-default" data-i18n-aria="ui.toggle_theme" title="Đổi giao diện" aria-pressed="false">☾</button>
        </div>
      </header>
      <div id="notice" class="alert" role="status" aria-live="polite" hidden></div>

      <section id="device-view">
        <div class="frappe-card p-3 mb-3">
          <div class="d-flex justify-content-between align-items-center">
            <span id="device-status-badge" class="indicator-pill orange" data-i18n="ui.device_not_activated"></span>
            <button id="return-to-app" type="button" class="btn btn-default btn-sm" data-i18n="ui.back_to_app" hidden></button>
          </div>
          <h2 class="h5 mt-2 mb-0" data-i18n="ui.activate_device_title"></h2>
        </div>

        <div class="frappe-card p-3 mb-3">
          <div class="d-flex flex-wrap justify-content-between align-items-center mb-2">
            <h2 class="h6 mb-2" data-i18n="ui.qr_device"></h2>
            <button id="scan-qr" type="button" class="btn btn-default mb-2" data-i18n="ui.camera_enable"></button>
          </div>
          <div id="camera-preview" class="embed-responsive embed-responsive-16by9 bg-dark rounded" hidden>
            <video id="qr-video" class="embed-responsive-item bg-dark" width="640" height="360" playsinline muted data-i18n-aria="ui.camera_view"></video>
          </div>
          <p id="camera-status" class="text-muted mt-2 mb-3" data-i18n="ui.camera_idle" role="status" aria-live="polite"></p>

          <div class="d-flex align-items-center my-3">
            <hr class="flex-grow-1 my-0"><span class="text-muted px-2" data-i18n="ui.or"></span><hr class="flex-grow-1 my-0">
          </div>
          <div class="form-group mb-3">
            <label for="device-id" data-i18n="ui.device_id_manual"></label>
            <input id="device-id" class="form-control" autocomplete="off" spellcheck="false" data-i18n-placeholder="ui.device_id_placeholder">
          </div>
          <div class="d-flex">
            <button id="activate-device" type="button" class="btn btn-primary flex-grow-1 mr-2 mb-2" data-i18n="ui.activate_sync"></button>
            <button id="check-device" type="button" class="btn btn-default mb-2" data-i18n="ui.check_device"></button>
          </div>
        </div>

        <div class="row">
          <div class="col-6 mb-3">
            <div class="frappe-card p-3 h-100"><small class="text-muted d-block" data-i18n="ui.device_name"></small><strong id="device-name-label" class="text-break"></strong></div>
          </div>
          <div class="col-6 mb-3">
            <div class="frappe-card p-3 h-100"><small class="text-muted d-block" data-i18n="ui.company"></small><strong id="device-company-label" class="text-break"></strong></div>
          </div>
        </div>
      </section>

      <section id="home-view" hidden>
        <div class="rfid-home-tabs" role="tablist" data-i18n-aria="ui.home_navigation">
          <button id="home-tab-active" type="button" role="tab" aria-selected="true" aria-controls="home-active-panel" data-home-tab="active" data-i18n="ui.sessions"></button>
          <button id="home-tab-history" type="button" role="tab" aria-selected="false" aria-controls="home-history-panel" data-home-tab="history" tabindex="-1" data-i18n="ui.history"></button>
        </div>
        <section id="home-active-panel" role="tabpanel" aria-labelledby="home-tab-active">
          <div class="frappe-card rfid-setup-card">
            <h2 class="h5" data-i18n="ui.new_session"></h2>
            <label for="booking-entry" data-i18n="ui.booking_ids"></label>
            <div class="rfid-booking-entry"><input id="booking-entry" class="form-control" autocomplete="off" spellcheck="false" data-i18n-placeholder="ui.booking_entry_hint"><button id="add-booking" class="btn btn-default" type="button" data-i18n="ui.add_booking"></button></div>
            <div id="booking-chips" aria-live="polite"></div>
            <textarea id="booking-ids" hidden aria-hidden="true" tabindex="-1"></textarea>
            <button id="start-session" type="button" class="btn btn-primary btn-block" data-i18n="ui.start"></button>
          </div>
          <div class="frappe-card rfid-setup-card"><div class="rfid-section-heading"><h2 class="h5" data-i18n="ui.active"></h2><button id="refresh-active" type="button" class="btn btn-default" data-i18n="ui.refresh"></button></div><div id="active-list"></div></div>
        </section>
        <section id="home-history-panel" role="tabpanel" aria-labelledby="home-tab-history" hidden>
          <div class="frappe-card rfid-setup-card"><div class="rfid-section-heading"><h2 class="h5" data-i18n="ui.history_sessions"></h2><button id="refresh-history" type="button" class="btn btn-default" data-i18n="ui.refresh"></button></div><div id="history-list"></div></div>
        </section>
        <p id="device-summary" class="rfid-device-caption text-muted"></p>
      </section>

      <section id="session-view" hidden>
        <div class="frappe-card p-3 mb-3">
          <div id="session-summary" class="row mx-n1 mb-3">
            <div class="col-4 px-1"><div class="alert alert-info text-center p-2 mb-0 h-100"><small class="d-block text-dark" data-i18n="ui.metric_scanned"></small><strong id="metric-scanned" class="d-block h5 mb-0"></strong></div></div>
            <div class="col-4 px-1"><div class="alert alert-success text-center p-2 mb-0 h-100"><small class="d-block text-dark" data-i18n="ui.metal_checked"></small><strong id="metric-metal" class="d-block h5 mb-0"></strong></div></div>
            <div class="col-4 px-1"><div class="alert alert-warning text-center p-2 mb-0 h-100"><small class="d-block text-dark" data-i18n="ui.boxes"></small><strong id="metric-boxes" class="d-block h5 mb-0"></strong></div></div>
          </div>
          <div id="session-warnings" class="alert alert-warning" hidden></div>

        </div>

        <section id="completion-form" class="frappe-card p-3 mb-3" aria-labelledby="completion-title" hidden>
          <h3 id="completion-title" class="h6" data-i18n="ui.complete_details"></h3>
          <div class="form-group"><label for="completion-vehicle" data-i18n="ui.vehicle"></label><input id="completion-vehicle" class="form-control" autocomplete="off" required></div>
          <div class="form-group"><label for="completion-driver" data-i18n="ui.driver"></label><input id="completion-driver" class="form-control" autocomplete="off" required></div>
          <div class="form-group"><label for="completion-note" data-i18n="ui.note"></label><textarea id="completion-note" class="form-control" rows="3"></textarea></div>
          <button id="completion-photos" type="button" class="btn btn-default btn-block mb-3" data-i18n="ui.photos"></button>
          <div class="d-flex">
            <button id="cancel-completion" type="button" class="btn btn-default flex-grow-1 mr-2" data-i18n="ui.cancel"></button>
            <button id="confirm-completion" type="button" class="btn btn-primary flex-grow-1" data-i18n="ui.confirm_completion"></button>
          </div>
        </section>
        <p id="completion-upload-status" class="alert alert-info mb-3" role="status" aria-live="polite" hidden></p>

        <div class="rfid-session-tabs text-center mb-3">
          <div class="btn-group btn-group-sm d-flex" role="tablist" data-i18n-aria="ui.session_tabs">
            <button id="tab-po" type="button" class="btn btn-primary active small text-nowrap flex-fill px-1 py-3" role="tab" data-session-tab="po" aria-controls="panel-po" aria-selected="true" tabindex="0"><span data-i18n="ui.po"></span> <span id="tab-po-count" class="badge badge-light">0</span></button>
            <button id="tab-items" type="button" class="btn btn-default small text-nowrap flex-fill px-1 py-3" role="tab" data-session-tab="items" aria-controls="panel-items" aria-selected="false" tabindex="-1"><span data-i18n="ui.items"></span> <span id="tab-items-count" class="badge badge-light">0</span></button>
            <button id="tab-boxes" type="button" class="btn btn-default small text-nowrap flex-fill px-1 py-3" role="tab" data-session-tab="boxes" aria-controls="panel-boxes" aria-selected="false" tabindex="-1"><span data-i18n="ui.boxes"></span></button>
          </div>
        </div>
        <section id="panel-po" class="frappe-card p-3 mb-3" role="tabpanel" aria-labelledby="tab-po"><div id="po-list" class="table-responsive"></div></section>
        <section id="panel-items" class="mb-3" role="tabpanel" aria-labelledby="tab-items" hidden><div id="item-list"></div></section>
        <section id="panel-boxes" class="frappe-card p-3 mb-3" role="tabpanel" aria-labelledby="tab-boxes" hidden>
          <div class="btn-group btn-group-sm d-flex mb-3" role="group" data-i18n-aria="ui.box_filters">
            <button type="button" class="btn btn-primary flex-fill" data-box-filter="not-scanned" aria-pressed="true"><span data-i18n="ui.box_not_scanned"></span> <span id="box-not-scanned-count" class="badge badge-light">0</span></button>
            <button type="button" class="btn btn-default flex-fill" data-box-filter="scanning" aria-pressed="false"><span data-i18n="ui.box_scanning"></span> <span id="box-scanning-count" class="badge badge-light">0</span></button>
            <button type="button" class="btn btn-default flex-fill" data-box-filter="completed" aria-pressed="false"><span data-i18n="ui.box_completed"></span> <span id="box-completed-count" class="badge badge-light">0</span></button>
          </div>
          <div class="d-flex mb-3"><label for="box-search" class="sr-only" data-i18n="ui.box_search"></label><input id="box-search" type="search" class="form-control mr-2" data-i18n-placeholder="ui.box_search"><button id="clear-box-search" type="button" class="btn btn-default" data-i18n-aria="ui.clear_filter" data-i18n-title="ui.clear_filter"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg></button></div>
          <div id="box-list" class="table-responsive"></div>
        </section>
        <div id="scan-dock-spacer" class="py-5 mb-5" aria-hidden="true" hidden></div>
        <div id="scan-dock" class="fixed-bottom bg-white border-top shadow-sm py-2" hidden>
          <div class="container-fluid"><div class="row justify-content-center"><div class="col-12 col-sm-11 col-md-10 col-lg-8 col-xl-7">
            <div id="scan-controls" class="d-flex align-items-center mb-2"><label for="rfid-input" class="sr-only" data-i18n="ui.scan_rfid"></label><input id="rfid-input" class="form-control" autocomplete="off" autocapitalize="off" autocorrect="off" inputmode="none" spellcheck="false" data-i18n-placeholder="ui.scan_rfid"><button id="toggle-scan" type="button" class="btn ml-2" aria-pressed="false" data-i18n="ui.pause_scan"></button></div>
            <div class="rfid-dock-actions">
              <button id="back-home" type="button" class="btn btn-default" data-i18n="ui.home"></button>
              <button id="session-photos" type="button" class="btn btn-default" data-i18n="ui.photos" hidden></button>
              <button id="refresh-session" type="button" class="btn btn-primary" data-i18n="ui.refresh"></button>
              <button id="complete-session" type="button" class="btn btn-default" data-i18n="ui.complete_short"></button>
            </div>
          </div></div></div>
        </div>
      </section>
    </div>
  </div>
  <div id="item-detail-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="item-detail-title" aria-hidden="true" tabindex="-1" hidden>
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" role="document">
      <div class="modal-content">
        <div class="modal-header align-items-center">
          <h2 id="item-detail-title" class="modal-title h5 text-break"></h2>
          <button id="close-item-detail" type="button" class="btn btn-default btn-sm ml-2" data-i18n-aria="ui.close" data-i18n-title="ui.close">&times;</button>
        </div>
        <div id="item-detail-body" class="modal-body"></div>
      </div>
    </div>
  </div>
  <dialog id="device-info-modal" aria-labelledby="device-info-title">
    <div class="rfid-dialog-header"><h2 id="device-info-title" data-i18n="ui.device_info"></h2><button id="close-device-info" type="button" class="btn btn-default" data-i18n-aria="ui.close">×</button></div>
    <div class="rfid-dialog-body">
      <div class="rfid-device-grid"><div><small data-i18n="ui.device_id"></small><strong id="info-device-id"></strong></div><div><small data-i18n="ui.device_name"></small><strong id="info-device-name"></strong></div><div class="rfid-company"><small data-i18n="ui.company"></small><strong id="info-company"></strong></div></div>
      <p class="rfid-device-ready" data-i18n="ui.device_activated"></p>
      <button id="manage-device" type="button" class="btn btn-default btn-block" data-i18n="ui.activate_sync"></button>
      <button id="change-device" type="button" class="btn btn-danger btn-block" data-i18n="ui.clear_device"></button>
    </div>
  </dialog>
  <dialog id="photo-dialog" aria-labelledby="photo-title">
    <div class="rfid-dialog-header"><h2 id="photo-title" data-i18n="ui.photos"></h2><button id="close-photos" type="button" class="btn btn-default" data-i18n-aria="ui.close">×</button></div>
    <div class="rfid-dialog-body">
      <p class="text-muted" data-i18n="ui.photo_hint"></p>
      <div class="rfid-photo-actions"><button id="choose-photos" type="button" class="btn btn-primary" data-i18n="ui.choose_photos"></button><button id="take-photo" type="button" class="btn btn-default" data-i18n="ui.take_photo"></button></div>
      <input id="photo-files" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
      <input id="photo-camera" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden>
      <p id="photo-status" role="status" aria-live="polite"></p>
      <div id="photo-queue"></div><div id="photo-grid"></div>
      <button id="more-photos" type="button" class="btn btn-default btn-block" data-i18n="ui.more_photos" hidden></button>
      <button id="reload-photos" type="button" class="btn btn-default btn-block" data-i18n="ui.refresh"></button>
    </div>
  </dialog>
  <dialog id="photo-viewer" aria-label="Photo"><button id="close-photo-viewer" type="button" class="btn btn-default" data-i18n="ui.close"></button><img id="photo-full" alt=""></dialog>
</main>
